<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kahve içelim mi?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#F6E2E7; --blush-deep:#E9CCDC; --card:#FFFCF6;
    --ink:#43202D; --ink-soft:#8B6675;
    --rose:#B93E66; --rose-soft:#F0C5D4; --gold:#B9954F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(120% 90% at 20% 0%,#FCEFF3 0,transparent 60%),
               linear-gradient(160deg,var(--blush),var(--blush-deep));
    min-height:100dvh;display:grid;place-items:center;
    padding:28px 18px 44px;overflow-x:hidden;
  }
  .sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .sky span{position:absolute;bottom:-40px;color:var(--rose);opacity:.26;font-size:14px;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.3}100%{transform:translateY(-115dvh) rotate(220deg);opacity:0}}

  #konfeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:999}
  #konfeti i{position:absolute;display:block;border-radius:1px}

  .card{position:relative;z-index:1;width:100%;max-width:430px;background:var(--card);
    border-radius:24px;padding:38px 32px 32px;text-align:center;
    box-shadow:0 26px 64px -30px rgba(67,32,45,.5),0 2px 0 rgba(255,255,255,.7) inset;
    animation:pop .55s cubic-bezier(.2,.9,.3,1.15) both}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

  .eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
  .avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;border:5px solid #fff;
    box-shadow:0 12px 26px -14px rgba(67,32,45,.55);margin:0 auto 18px;display:block;background:var(--rose-soft)}
  .art{width:104px;height:104px;margin:0 auto 18px;display:block}

  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(23px,6vw,29px);
    line-height:1.28;letter-spacing:-.015em;margin-bottom:10px;text-wrap:balance}
  .sub{font-size:14px;line-height:1.55;color:var(--ink-soft);margin-bottom:26px;text-wrap:balance}
  .fine{font-family:'Fraunces',serif;font-style:italic;font-size:13.5px;color:var(--ink-soft);line-height:1.65;margin:16px 2px 0}

  button,.btn{font-family:inherit;cursor:pointer;border:0}
  .btn{display:block;width:100%;background:linear-gradient(180deg,#CB4E76,var(--rose));color:#fff;
    font-size:16px;font-weight:500;padding:16px;border-radius:100px;text-decoration:none;
    box-shadow:0 14px 26px -13px rgba(185,62,102,.95);transition:transform .16s,box-shadow .16s}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
  .ghost{display:inline-block;margin-top:13px;font-size:13.5px;color:var(--rose);
    text-decoration:none;border-bottom:1px solid var(--rose-soft);padding-bottom:2px;background:none}

  .no-btn{position:fixed;z-index:50;background:#EBDEE5;color:var(--ink-soft);font-size:15px;
    padding:13px 28px;border-radius:100px;
    transition:left .3s cubic-bezier(.3,1.4,.5,1),top .3s cubic-bezier(.3,1.4,.5,1),transform .25s}

  label{display:block;text-align:left;font-size:12.5px;font-weight:500;margin:0 2px 8px;color:var(--ink)}
  input[type=date],select,input[type=text]{width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    background:#FDF6F8;border:1.5px solid var(--rose-soft);padding:14px;border-radius:13px;
    margin-bottom:18px;appearance:none}
  input[type=date]:focus,select:focus,input[type=text]:focus{outline:2px solid var(--rose);outline-offset:1px}
  input[type=text]::placeholder{color:var(--ink-soft);opacity:.6}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;justify-items:center}
  .grid .tile{width:100%}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .tile{background:#FBF3F6;border:1.5px solid transparent;border-radius:15px;padding:15px 5px 12px;
    font-size:11.5px;color:var(--ink-soft);transition:all .18s}
  .tile b{display:block;font-size:25px;margin-bottom:7px;font-weight:400}
  .tile:hover{transform:translateY(-2px)}
  .tile[aria-pressed=true]{border-color:var(--rose);background:#FDEAF1;color:var(--ink);font-weight:500}

  .veya{font-size:12px;color:var(--ink-soft);margin-bottom:12px;display:flex;align-items:center;gap:12px}
  .veya::before,.veya::after{content:'';flex:1;height:1px;background:var(--rose-soft)}

  .ticket{position:relative}
  .stub{border-top:1.5px dashed var(--rose-soft);margin-top:22px;padding-top:18px;text-align:left}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0}
  .row dt{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
  .row dd{font-family:'Fraunces',serif;font-weight:600;font-size:15px;text-align:right}

  .steps{display:flex;gap:6px;justify-content:center;margin-top:24px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--rose-soft);transition:width .3s}
  .dot.on{background:var(--rose);width:18px;border-radius:3px}
  .hide{display:none}

  /* kedi */
  .kedi-wrap{position:relative;width:100%;max-width:430px}
  #kediCanvas{position:absolute;bottom:-32px;right:4px;width:120px;height:144px;z-index:2;pointer-events:none}

  /* çizim animasyonları */
  .steam{animation:steam 3s ease-in-out infinite}
  .steam:nth-child(2){animation-delay:.5s}
  .steam:nth-child(3){animation-delay:1s}
  @keyframes steam{0%,100%{opacity:.25;transform:translateY(2px)}50%{opacity:.7;transform:translateY(-3px)}}
  .sway{animation:sway 4s ease-in-out infinite;transform-origin:50% 60%}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .twinkle{animation:tw 2.4s ease-in-out infinite}
  .twinkle:nth-of-type(even){animation-delay:1.2s}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.sky,#konfeti{display:none}}
</style>
</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<div id="konfeti" aria-hidden="true"></div>
<div class="kedi-wrap">
  <main class="card" id="card"></main>
  <canvas id="kediCanvas" width="200" height="240" aria-hidden="true"></canvas>
</div>
<button class="no-btn hide" id="noBtn">hayır</button>

<script>
/* ═════════ SADECE BU BLOĞU DEĞİŞTİR ═════════ */
const CONFIG = {
  isim:    "Handenur",
  foto:    "",
  telefon: "905322101161",
  saatler: ["12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00"],
  kapanis: "Anlaştık sayılır 🤝",
  imza:    "Normal insanlar mesaj atar. Ben oturup sana site yaptım. Kedilerin bile bu kadar ilgi beklemez 🐱"
};
/* ══════════════════════════════════════════ */

const icecekler=[{e:"☕",t:"Türk kahvesi"},{e:"🥛",t:"Latte"},{e:"🫖",t:"Filtre"},
  {e:"🖤",t:"Amerikano"},{e:"🍵",t:"Matcha"},{e:"🍫",t:"Sıcak çikolata"},{e:"🧊",t:"Soğuk bir şey"}];

const mekanlar=[
  {e:"🏡",t:"Sakin bir kafe"},
  {e:"🌊",t:"Sahil kenarı"},
  {e:"🌳",t:"Açık hava, yeşillik"},
  {e:"🏙️",t:"Şehir merkezi"},
  {e:"☕",t:"Semtin kafesi"},
  {e:"🎲",t:"Sen karar ver"}
];

const state={tarih:"",saat:"",icecek:"",mekan:"",mekanOzel:""};
const card=document.getElementById('card'), noBtn=document.getElementById('noBtn');
let kacis=0;

const laflar=["hayır","emin misin?","bir daha düşün 🤔","cidden mi?","ama plan yapmıştım 😢",
  "yakalayamazsın 🏃‍♂️","hâlâ mı?","biraz yoruldum","tekrar dene","olmayacak 😤","ısrarcısın ha",
  "bak sıkıldım 🥱","hiç şansın yok","peki kovala 😂","vaz mı geçtin?","hadi pes et","inatçı 😏"];

const ADIM_SAYISI=6;

/* ── çizimler ── */
const ART = {
  zarf:`<svg class="art sway" viewBox="0 0 100 100" fill="none">
    <rect x="12" y="28" width="76" height="52" rx="7" fill="#fff" stroke="var(--rose)" stroke-width="2"/>
    <path d="M12 34l38 27 38-27" stroke="var(--rose)" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 76l26-21M88 76L62 55" stroke="var(--rose-soft)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="55" r="13" fill="var(--rose)"/>
    <path d="M50 61c-4-3.2-7-5.4-7-8.4a3.6 3.6 0 016.2-2.3l.8.9.8-.9a3.6 3.6 0 016.2 2.3c0 3-3 5.2-7 8.4z" fill="#FFFCF6"/>
    <g fill="var(--gold)">
      <circle class="twinkle" cx="22" cy="19" r="2.2"/>
      <circle class="twinkle" cx="80" cy="16" r="1.8"/>
      <circle class="twinkle" cx="66" cy="24" r="1.4"/>
    </g></svg>`,

  fincan:`<svg class="art" viewBox="0 0 100 100" fill="none">
    <g stroke="var(--rose)" stroke-width="2" stroke-linecap="round">
      <path class="steam" d="M40 26c3-4-3-7 0-11"/>
      <path class="steam" d="M50 24c3-4-3-8 0-12"/>
      <path class="steam" d="M60 26c3-4-3-7 0-11"/>
    </g>
    <path d="M26 44h48v16a20 20 0 01-20 20h-8a20 20 0 01-20-20V44z" fill="#fff" stroke="var(--rose)" stroke-width="2"/>
    <path d="M74 50h5a9 9 0 010 18h-5" stroke="var(--rose)" stroke-width="2"/>
    <path d="M26 44h48" stroke="var(--rose)" stroke-width="2"/>
    <path d="M31 55c8 3 14 3 19 0s12-3 19 0" stroke="var(--rose-soft)" stroke-width="2"/>
    <path d="M18 86h64" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round"/></svg>`,

  takvim:`<svg class="art sway" viewBox="0 0 100 100" fill="none">
    <rect x="16" y="24" width="68" height="62" rx="9" fill="#fff" stroke="var(--rose)" stroke-width="2"/>
    <path d="M16 41h68" stroke="var(--rose)" stroke-width="2"/>
    <path d="M33 18v13M67 18v13" stroke="var(--rose)" stroke-width="3" stroke-linecap="round"/>
    <g fill="var(--rose-soft)">
      <circle cx="33" cy="54" r="3.4"/><circle cx="50" cy="54" r="3.4"/><circle cx="67" cy="54" r="3.4"/>
      <circle cx="33" cy="70" r="3.4"/><circle cx="67" cy="70" r="3.4"/>
    </g>
    <circle cx="50" cy="70" r="9" fill="var(--rose)"/>
    <path d="M46 70l3 3 5-6" stroke="#FFFCF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,

  pin:`<svg class="art sway" viewBox="0 0 100 100" fill="none">
    <path d="M50 88s-26-22-26-42a26 26 0 0152 0c0 20-26 42-26 42z" fill="#fff" stroke="var(--rose)" stroke-width="2"/>
    <circle cx="50" cy="46" r="11" fill="var(--rose)"/>
    <path d="M50 51c-3-2.4-5.5-4.2-5.5-6.5a2.8 2.8 0 014.8-1.8l.7.7.7-.7a2.8 2.8 0 014.8 1.8c0 2.3-2.5 4.1-5.5 6.5z" fill="#FFFCF6"/>
    <g fill="var(--gold)">
      <circle class="twinkle" cx="18" cy="28" r="2"/>
      <circle class="twinkle" cx="82" cy="32" r="1.6"/>
      <circle class="twinkle" cx="26" cy="78" r="1.4"/>
    </g></svg>`,

  bilet:`<svg class="art" viewBox="0 0 100 100" fill="none">
    <circle cx="50" cy="50" r="30" fill="#fff" stroke="var(--gold)" stroke-width="2"/>
    <circle cx="50" cy="50" r="24" stroke="var(--rose-soft)" stroke-width="1.5" stroke-dasharray="3 4"/>
    <path d="M38 51l8 8 17-19" stroke="var(--rose)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="var(--gold)">
      <circle class="twinkle" cx="17" cy="30" r="2.4"/><circle class="twinkle" cx="85" cy="34" r="2"/>
      <circle class="twinkle" cx="24" cy="76" r="1.8"/><circle class="twinkle" cx="80" cy="72" r="2.4"/>
    </g></svg>`
};
const gorsel=()=>CONFIG.foto?`<img class="avatar" src="${CONFIG.foto}" alt="">`:ART.zarf;
const noktalar=n=>`<div class="steps">${Array.from({length:ADIM_SAYISI},(_, i)=>`<i class="dot ${i===n?'on':''}"></i>`).join('')}</div>`;
const geri=fn=>{const g=document.getElementById('geri'); if(g) g.onclick=e=>{e.preventDefault();fn()}};

/* ── kaçan buton ── */
function yerlestir(){
  const c=card.getBoundingClientRect();
  noBtn.style.left=(c.left+c.width/2-52)+'px';
  noBtn.style.top=Math.min(c.bottom+16,innerHeight-72)+'px';
}
function sifirlaNo(){
  kacis=0;
  noBtn.textContent=laflar[0];
  noBtn.style.transform='none';
  noBtn.classList.remove('hide');
  yerlestir();
}
function kac(){
  kacis++;
  noBtn.textContent=laflar[kacis%laflar.length];
  const p=18,w=noBtn.offsetWidth,h=noBtn.offsetHeight;
  noBtn.style.left=(p+Math.random()*(innerWidth-w-p*2))+'px';
  noBtn.style.top=(p+Math.random()*(innerHeight-h-p*2))+'px';
  noBtn.style.transform='scale('+(0.74+Math.abs(Math.sin(kacis))*0.14)+')';
}
noBtn.addEventListener('mouseenter',kac);
noBtn.addEventListener('click',e=>{e.preventDefault();kac()});
noBtn.addEventListener('touchstart',e=>{e.preventDefault();kac()},{passive:false});

/* ── 0 · giriş ── */
function adim0(){
  card.innerHTML=`
    <p class="eyebrow">Bir dakikanı alacak</p>
    ${gorsel()}
    <h1>${CONFIG.isim}, sana bir şey sorabilir miyim?</h1>
    <p class="sub">Kötü bir şey değil, söz. İki buton var ama birine çok güvenme, kedilerin kadar huysuz çıktı 🐱</p>
    <button class="btn" id="evet">Sor bakalım</button>
    ${noktalar(0)}`;
  sifirlaNo();
  document.getElementById('evet').onclick=adim1;
}

/* ── 1 · teklif ── */
function adim1(){
  card.innerHTML=`
    <p class="eyebrow">Soru şu</p>
    ${ART.fincan}
    <h1>Bir kahve içmeye ne dersin?</h1>
    <p class="sub">Büyük bir mesele değil, sadece iki fincan ve güzel bir sohbet ☕ Kediler de onaylarsa tabii 🐾</p>
    <button class="btn" id="evet">Olur, içelim</button>
    <a class="ghost" href="#" id="geri">← Geri</a>
    ${noktalar(1)}`;
  sifirlaNo();
  document.getElementById('evet').onclick=()=>{noBtn.classList.add('hide');kalpler(16);adim2()};
  geri(adim0);
}

/* ── 2 · gün + saat ── */
function adim2(){
  noBtn.classList.add('hide');
  card.innerHTML=`
    <p class="eyebrow">Adım bir</p>
    ${ART.takvim}
    <h1>Hangi gün müsaitsin?</h1>
    <p class="sub">Sen bir gün söyle, gerisini bana bırak. Plancı tarafım devreye girdi bile 📋✨</p>
    <label for="t">Gün</label><input type="date" id="t" value="${state.tarih}">
    <label for="s">Saat</label>
    <select id="s"><option value="">Seç</option>${CONFIG.saatler.map(x=>`<option ${x===state.saat?'selected':''}>${x}</option>`).join('')}</select>
    <button class="btn" id="ileri">Devam et</button>
    <a class="ghost" href="#" id="geri">← Geri</a>
    ${noktalar(2)}`;
  const t=document.getElementById('t'),s=document.getElementById('s'),b=document.getElementById('ileri');
  t.min=new Date().toISOString().split('T')[0];
  const kontrol=()=>b.disabled=!(t.value&&s.value);
  t.onchange=s.onchange=kontrol; kontrol();
  b.onclick=()=>{state.tarih=t.value;state.saat=s.value;adim3()};
  geri(adim1);
}

/* ── 3 · içecek ── */
function adim3(){
  card.innerHTML=`
    <p class="eyebrow">Adım iki</p>
    ${ART.fincan}
    <h1>Ne içersin?</h1>
    <p class="sub">Yanlış seçersen karşında yanlış mekân olur, düşünerek bas 🤔😄</p>
    <div class="grid">${icecekler.map((y,i)=>`<button class="tile" data-i="${i}" aria-pressed="${y.t===state.icecek}"><b>${y.e}</b>${y.t}</button>`).join('')}</div>
    <button class="btn" id="ileri" ${state.icecek?'':'disabled'}>Devam et</button>
    <a class="ghost" href="#" id="geri">← Geri</a>
    ${noktalar(3)}`;
  const b=document.getElementById('ileri');
  card.querySelectorAll('.tile').forEach(el=>el.onclick=()=>{
    card.querySelectorAll('.tile').forEach(o=>o.setAttribute('aria-pressed','false'));
    el.setAttribute('aria-pressed','true');
    state.icecek=icecekler[el.dataset.i].t; b.disabled=false;
  });
  b.onclick=()=>adim4();
  geri(adim2);
}

/* ── 4 · mekân ── */
function adim4(){
  const ozelDeger=state.mekanOzel||'';
  const secili=state.mekan;
  card.innerHTML=`
    <p class="eyebrow">Adım üç</p>
    ${ART.pin}
    <h1>Nerede buluşalım?</h1>
    <p class="sub">Gezgin ruhun nereye çağırıyorsa oraya ✈️ Ya da bir yer yaz, kalanını bana bırak 🐾</p>
    <div class="grid2">${mekanlar.map((m,i)=>`<button class="tile" data-i="${i}" aria-pressed="${m.t===secili&&!ozelDeger}"><b>${m.e}</b>${m.t}</button>`).join('')}</div>
    <div class="veya">ya da</div>
    <input type="text" id="ozelMekan" placeholder="✏️ Şu kafe, şu ilçe, şu sokak…" value="${ozelDeger}">
    <button class="btn" id="ileri" ${(secili||ozelDeger)?'':'disabled'}>Tamamdır</button>
    <a class="ghost" href="#" id="geri">← Geri</a>
    ${noktalar(4)}`;
  const b=document.getElementById('ileri');
  const inp=document.getElementById('ozelMekan');
  const tiles=card.querySelectorAll('.tile');

  tiles.forEach(el=>el.onclick=()=>{
    tiles.forEach(o=>o.setAttribute('aria-pressed','false'));
    el.setAttribute('aria-pressed','true');
    state.mekan=mekanlar[el.dataset.i].t;
    state.mekanOzel='';
    inp.value='';
    b.disabled=false;
  });

  inp.addEventListener('input',()=>{
    const v=inp.value.trim();
    if(v){
      tiles.forEach(o=>o.setAttribute('aria-pressed','false'));
      state.mekanOzel=v;
      state.mekan=v;
      b.disabled=false;
    } else {
      state.mekanOzel='';
      /* hiçbiri seçili değilse butonu kapat */
      const herhangi=[...tiles].some(t=>t.getAttribute('aria-pressed')==='true');
      if(!herhangi){state.mekan=''; b.disabled=true;}
    }
  });

  b.onclick=()=>{patlat();adim5()};
  geri(adim3);
}

/* ── 5 · onay ── */
function adim5(){
  kalpler(24);
  const dt=new Date(state.tarih);
  const gun=dt.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
  const mekanGosterim=state.mekan==='Sen karar ver'?'Sürpriz — sen karar ver 🎲':state.mekan;
  const mekanYazi=state.mekan==='Sen karar ver'?'Sen karar ver, surpriz olsun':state.mekan;
  const mesaj=encodeURIComponent(
`Peki, ikna oldum :)

Gun: ${gun}
Saat: ${state.saat}
Icecek: ${state.icecek}
Mekan: ${mekanYazi}

Gec kalma, kahvem sogumasin.
Gorusuruz!`);
  card.innerHTML=`
    <div class="ticket">
      <p class="eyebrow">Onaylandı</p>
      ${ART.bilet}
      <h1>${CONFIG.kapanis}<br>${state.saat}'de görüşürüz.</h1>
      <p class="fine">${CONFIG.imza}</p>
      <dl class="stub">
        <div class="row"><dt>Gün</dt><dd>${gun}</dd></div>
        <div class="row"><dt>Saat</dt><dd>${state.saat}</dd></div>
        <div class="row"><dt>Kahven</dt><dd>${state.icecek}</dd></div>
        <div class="row"><dt>Mekân</dt><dd>${mekanGosterim}</dd></div>
      </dl>
    </div>
    <br>
    <a class="btn" href="https://wa.me/${CONFIG.telefon}?text=${mesaj}" target="_blank" rel="noopener">Cevabımı gönder</a>
    <a class="ghost" href="${takvimLinki(dt)}" target="_blank" rel="noopener">📅 Takvimime ekle</a><br>
    <a class="ghost" href="#" id="geri">← Seçimimi değiştir</a>
    ${noktalar(5)}`;
  geri(adim4);
}

/* ── konfeti ── */
function patlat(){
  const kutu=document.getElementById('konfeti');
  const renkler=['#B93E66','#E8A0BB','#C89B5A','#7E4E63','#F0C5D4','#FFFCF6'];
  const kaynaklar=[[.5,.55],[.15,.45],[.85,.45]];
  kaynaklar.forEach((k,i)=>setTimeout(()=>{
    for(let j=0;j<60;j++){
      const el=document.createElement('i');
      const en=5+Math.random()*6, boy=8+Math.random()*9;
      el.style.cssText=`left:${k[0]*100}%;top:${k[1]*100}%;width:${en}px;height:${boy}px;
        background:${renkler[j%renkler.length]}`;
      kutu.appendChild(el);
      const aci=Math.random()*Math.PI*2, guc=140+Math.random()*260;
      const x=Math.cos(aci)*guc, y=Math.sin(aci)*guc-160;
      const sure=1600+Math.random()*1400;
      el.animate([
        {transform:'translate(0,0) rotate(0deg)',opacity:1},
        {transform:`translate(${x*.6}px,${y*.75}px) rotate(${180+Math.random()*360}deg)`,opacity:1,offset:.45},
        {transform:`translate(${x}px,${innerHeight*.75}px) rotate(${540+Math.random()*540}deg)`,opacity:0}
      ],{duration:sure,easing:'cubic-bezier(.15,.6,.5,1)',fill:'forwards'});
      setTimeout(()=>el.remove(),sure+80);
    }
  },i*170));
}

function takvimLinki(dt){
  const [h,m]=state.saat.split(':');
  const bas=new Date(dt); bas.setHours(+h,+m,0,0);
  const bit=new Date(bas.getTime()+1.5*36e5);
  const f=d=>d.toISOString().replace(/[-:]|\.\d{3}/g,'');
  const detay=encodeURIComponent('Kahve randevusu ☕ — '+state.icecek+' · '+state.mekan);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('Kahve ☕')}&dates=${f(bas)}/${f(bit)}&details=${detay}`;
}

/* ═══════ Canvas Kedi ═══════ */
(function(){
  const cv=document.getElementById('kediCanvas');
  if(!cv)return;
  const C=cv.getContext('2d');
  const W=cv.width, H=cv.height;
  // renk paleti
  const FUR='#F5E6D3';       // krem tüy
  const FUR_DARK='#E0CDB8';  // gölge tüy
  const FUR_LIGHT='#FFF5EA'; // açık highlight
  const PINK='#E8A0BB';      // kulak içi / burun
  const NOSE='#D4788E';      // burun koyu
  const EYE='#5B7A52';       // yeşil göz
  const PUPIL='#1E2720';     // göz bebeği
  const MOUTH='#C27D8F';     // ağız
  const WHISKER='#A08577';   // bıyık

  let t=0, entranceT=0;
  const ENTRANCE_DUR=900; // ms
  let startTime=null;

  function ease(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}

  // smoothstep
  function ss(lo,hi,x){const t=Math.max(0,Math.min(1,(x-lo)/(hi-lo)));return t*t*(3-2*t)}

  // blink pattern: mostly open, quick blink
  function blinkY(t){
    const cycle=t%4500;
    if(cycle<200) return 1-ss(0,100,cycle)+ss(100,200,cycle);
    if(cycle>4200) return 1-ss(4200,4350,cycle)+ss(4350,4500,cycle);
    return 1;
  }

  function draw(now){
    if(!startTime)startTime=now;
    const elapsed=now-startTime;
    t=elapsed;

    // entrance slide-up
    const ep=Math.min(1,elapsed/ENTRANCE_DUR);
    const slide=ease(ep);
    const offsetY=(1-slide)*60;
    const alpha=slide;

    C.clearRect(0,0,W,H);
    C.globalAlpha=alpha;
    C.save();
    C.translate(0,offsetY);

    // breathing
    const breathe=Math.sin(t/1200)*0.008;
    // head tilt
    const headTilt=Math.sin(t/3500)*0.06;
    // tail sway
    const tailAngle=Math.sin(t/1100)*0.35;
    // ear twitch
    const earL=Math.sin(t/2800)*0.08;
    const earR=Math.sin(t/3200+1.5)*0.08;
    // whisker sway
    const whiskL=Math.sin(t/1500)*0.04;
    const whiskR=Math.sin(t/1700)*0.04;
    // blink
    const blink=blinkY(t);
    // purr vibrate
    const purr=Math.sin(t/80)*0.3;

    const cx=W/2, baseY=H*0.92;

    // ── Kuyruk ──
    C.save();
    C.translate(cx-28, baseY-52);
    C.rotate(tailAngle);
    C.beginPath();
    C.moveTo(0, 0);
    C.bezierCurveTo(-30, -20, -42, -55, -28, -78);
    C.bezierCurveTo(-22, -88, -12, -82, -16, -72);
    C.bezierCurveTo(-22, -58, -32, -28, -4, -6);
    C.closePath();
    const tg=C.createLinearGradient(-20,-78,0,0);
    tg.addColorStop(0,FUR_DARK);
    tg.addColorStop(0.5,FUR);
    tg.addColorStop(1,FUR_DARK);
    C.fillStyle=tg;
    C.fill();
    // tail tip
    C.beginPath();
    C.arc(-22,-78,5,0,Math.PI*2);
    C.fillStyle=FUR_LIGHT;
    C.fill();
    // stripes on tail
    C.strokeStyle='rgba(180,155,130,0.18)';
    C.lineWidth=2.5;
    for(let i=0;i<4;i++){
      const ty=-15-i*14;
      C.beginPath();
      C.moveTo(-6+i*2,ty);
      C.quadraticCurveTo(-18-i*3,ty-8,-12-i*4,ty-5);
      C.stroke();
    }
    C.restore();

    // ── Gövde ──
    C.save();
    C.translate(cx, baseY);
    C.scale(1, 1+breathe);

    // gövde shape
    C.beginPath();
    C.moveTo(-32, 0);
    C.bezierCurveTo(-36, -20, -34, -55, -22, -68);
    C.bezierCurveTo(-12, -78, 12, -78, 22, -68);
    C.bezierCurveTo(34, -55, 36, -20, 32, 0);
    C.closePath();
    const bg=C.createRadialGradient(0,-40,8, 0,-35,50);
    bg.addColorStop(0,FUR_LIGHT);
    bg.addColorStop(0.6,FUR);
    bg.addColorStop(1,FUR_DARK);
    C.fillStyle=bg;
    C.fill();

    // göğüs beyazlık
    C.beginPath();
    C.ellipse(0,-28,14,22,0,0,Math.PI*2);
    C.fillStyle='rgba(255,245,234,0.45)';
    C.fill();

    // tüy dokusu — ince çizgiler
    C.strokeStyle='rgba(180,155,130,0.1)';
    C.lineWidth=0.8;
    for(let i=0;i<16;i++){
      const angle=-2.8+i*0.35;
      const r=28+Math.random()*6;
      C.beginPath();
      C.moveTo(Math.cos(angle)*18, -40+Math.sin(angle)*18);
      C.lineTo(Math.cos(angle)*r, -40+Math.sin(angle)*r);
      C.stroke();
    }

    // tabletop stripes
    C.strokeStyle='rgba(180,155,130,0.12)';
    C.lineWidth=3;
    for(let i=0;i<3;i++){
      const sy=-50-i*8;
      C.beginPath();
      C.moveTo(-18+i*3,sy);
      C.quadraticCurveTo(0,sy-6+i*2,18-i*3,sy);
      C.stroke();
    }

    // ── Patiler ──
    // sol pati
    C.beginPath();
    C.ellipse(-16, 0, 12, 7, -0.15, 0, Math.PI*2);
    C.fillStyle=FUR;
    C.fill();
    C.beginPath();
    C.ellipse(-16, 0, 12, 7, -0.15, 0, Math.PI*2);
    C.strokeStyle=FUR_DARK;
    C.lineWidth=1;
    C.stroke();
    // pati pad
    drawPaw(C, -16, 2);

    // sağ pati
    C.beginPath();
    C.ellipse(16, 0, 12, 7, 0.15, 0, Math.PI*2);
    C.fillStyle=FUR;
    C.fill();
    C.beginPath();
    C.ellipse(16, 0, 12, 7, 0.15, 0, Math.PI*2);
    C.strokeStyle=FUR_DARK;
    C.lineWidth=1;
    C.stroke();
    drawPaw(C, 16, 2);

    C.restore();

    // ── Kafa ──
    C.save();
    C.translate(cx, baseY-66+purr*0.15);
    C.rotate(headTilt);

    // ── Kulaklar ──
    // sol kulak
    C.save();
    C.rotate(earL);
    drawEar(C, -18, -22, -1);
    C.restore();
    // sağ kulak
    C.save();
    C.rotate(earR);
    drawEar(C, 18, -22, 1);
    C.restore();

    // yüz oval
    C.beginPath();
    C.ellipse(0, 0, 28, 24, 0, 0, Math.PI*2);
    const fg=C.createRadialGradient(-4,-4,3, 0,0,28);
    fg.addColorStop(0, FUR_LIGHT);
    fg.addColorStop(0.5, FUR);
    fg.addColorStop(1, FUR_DARK);
    C.fillStyle=fg;
    C.fill();

    // yanak tüyü — yanaklar
    C.beginPath();
    C.ellipse(-18, 6, 10, 7, -0.2, 0, Math.PI*2);
    C.fillStyle='rgba(255,245,234,0.35)';
    C.fill();
    C.beginPath();
    C.ellipse(18, 6, 10, 7, 0.2, 0, Math.PI*2);
    C.fill();

    // yüz tüy dokusu
    C.strokeStyle='rgba(180,155,130,0.08)';
    C.lineWidth=0.6;
    for(let i=0;i<12;i++){
      const a=-3+i*0.5;
      const r=20+Math.random()*6;
      C.beginPath();
      C.moveTo(Math.cos(a)*14, Math.sin(a)*12);
      C.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      C.stroke();
    }

    // ── Gözler ──
    drawEye(C, -10, -3, blink, false);
    drawEye(C, 10, -3, blink, true);

    // ── Burun ──
    C.beginPath();
    C.moveTo(0, 6);
    C.bezierCurveTo(-3.5, 5, -4, 7, -3, 9);
    C.bezierCurveTo(-1, 10.5, 1, 10.5, 3, 9);
    C.bezierCurveTo(4, 7, 3.5, 5, 0, 6);
    C.closePath();
    const ng=C.createRadialGradient(0,8,1, 0,8,4);
    ng.addColorStop(0,NOSE);
    ng.addColorStop(1,PINK);
    C.fillStyle=ng;
    C.fill();
    // burun shine
    C.beginPath();
    C.ellipse(-1, 7.5, 1.2, 0.8, -0.3, 0, Math.PI*2);
    C.fillStyle='rgba(255,255,255,0.35)';
    C.fill();

    // ── Ağız ──
    C.beginPath();
    C.moveTo(0, 10);
    C.lineTo(0, 13);
    C.strokeStyle=MOUTH;
    C.lineWidth=1;
    C.lineCap='round';
    C.stroke();
    C.beginPath();
    C.moveTo(0, 13);
    C.quadraticCurveTo(-5, 16, -8, 14);
    C.strokeStyle=MOUTH;
    C.lineWidth=0.9;
    C.stroke();
    C.beginPath();
    C.moveTo(0, 13);
    C.quadraticCurveTo(5, 16, 8, 14);
    C.stroke();

    // ── Bıyıklar ──
    C.save();
    C.rotate(whiskL);
    drawWhiskers(C, -1, 10, -1);
    C.restore();
    C.save();
    C.rotate(whiskR);
    drawWhiskers(C, 1, 10, 1);
    C.restore();

    C.restore(); // head

    C.restore(); // entrance translate
    C.globalAlpha=1;
    requestAnimationFrame(draw);
  }

  function drawPaw(c, x, y){
    c.fillStyle=PINK;
    c.globalAlpha*=0.5;
    // big pad
    c.beginPath();
    c.ellipse(x, y+1, 4, 3, 0, 0, Math.PI*2);
    c.fill();
    // toes
    for(let i=-1;i<=1;i++){
      c.beginPath();
      c.ellipse(x+i*4, y-2.5, 2, 1.8, 0, 0, Math.PI*2);
      c.fill();
    }
    c.globalAlpha/=0.5;
  }

  function drawEar(c, x, y, dir){
    c.beginPath();
    c.moveTo(x-12*dir, y+16);
    c.quadraticCurveTo(x-2*dir, y-24, x+4*dir, y-18);
    c.quadraticCurveTo(x+14*dir, y-8, x+10*dir, y+16);
    c.closePath();
    const eg=c.createLinearGradient(x,y-20,x,y+16);
    eg.addColorStop(0,FUR_DARK);
    eg.addColorStop(1,FUR);
    c.fillStyle=eg;
    c.fill();
    // kulak içi
    c.beginPath();
    c.moveTo(x-7*dir, y+10);
    c.quadraticCurveTo(x-1*dir, y-16, x+3*dir, y-12);
    c.quadraticCurveTo(x+9*dir, y-3, x+6*dir, y+10);
    c.closePath();
    c.fillStyle='rgba(232,160,187,0.35)';
    c.fill();
  }

  function drawEye(c, x, y, blink, isRight){
    // göz beyazı
    c.beginPath();
    c.ellipse(x, y, 7, 6.5*blink, 0, 0, Math.PI*2);
    c.fillStyle='#FEFEFE';
    c.fill();
    if(blink<0.15)return;
    // iris
    const irisR=4.5;
    c.beginPath();
    c.ellipse(x+0.5, y+0.3, irisR, irisR*blink, 0, 0, Math.PI*2);
    const ig=c.createRadialGradient(x, y, 1, x, y, irisR);
    ig.addColorStop(0, '#8DB580');
    ig.addColorStop(0.5, EYE);
    ig.addColorStop(1, '#3E5636');
    c.fillStyle=ig;
    c.fill();
    // pupil
    c.beginPath();
    c.ellipse(x+0.5, y+0.3, 2, 3.5*blink, 0, 0, Math.PI*2);
    c.fillStyle=PUPIL;
    c.fill();
    // reflection
    c.beginPath();
    c.ellipse(x-1.5, y-2, 1.8, 1.5*blink, -0.3, 0, Math.PI*2);
    c.fillStyle='rgba(255,255,255,0.75)';
    c.fill();
    c.beginPath();
    c.ellipse(x+2, y+1.5, 0.9, 0.7*blink, 0, 0, Math.PI*2);
    c.fillStyle='rgba(255,255,255,0.4)';
    c.fill();
    // göz çevresi
    c.beginPath();
    c.ellipse(x, y, 7.2, 6.7*blink, 0, 0, Math.PI*2);
    c.strokeStyle='rgba(120,90,70,0.15)';
    c.lineWidth=0.8;
    c.stroke();
    // üst kirpik
    if(blink>0.5){
      c.strokeStyle='rgba(80,60,45,0.25)';
      c.lineWidth=0.7;
      for(let i=-2;i<=2;i++){
        const a=-Math.PI/2+i*0.25;
        c.beginPath();
        c.moveTo(x+Math.cos(a)*6.5, y+Math.sin(a)*6*blink);
        c.lineTo(x+Math.cos(a)*8.5, y+Math.sin(a)*8*blink);
        c.stroke();
      }
    }
  }

  function drawWhiskers(c, dir, y, side){
    c.strokeStyle=WHISKER;
    c.lineWidth=0.7;
    c.lineCap='round';
    c.globalAlpha*=0.4;
    for(let i=-1;i<=1;i++){
      c.beginPath();
      c.moveTo(side*8, y+i*2.5);
      c.quadraticCurveTo(side*22, y+i*4-2, side*32, y+i*5-1);
      c.stroke();
    }
    c.globalAlpha/=0.4;
  }

  // start after a short delay for entrance
  setTimeout(()=>requestAnimationFrame(draw),400);
})();
</script>
